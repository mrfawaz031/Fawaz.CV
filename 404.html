<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — الصفحة غير موجودة | Page Not Found</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050608;
    --surface:#12131c;
    --line:#272a3d;
    --text:#f4f5fa;
    --text-muted:#8b8fa8;
    --teal:#8b6bff;
    --gold:#e7b24e;
  }
  *{box-sizing:border-box; margin:0;}
  html{scroll-behavior:smooth;}
  body{
    background:
      radial-gradient(800px 500px at 50% 30%, #1f1650 0%, transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Cairo','Space Grotesk',sans-serif;
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    text-align:center; padding:24px;
    -webkit-font-smoothing:antialiased;
  }
  .container{max-width:480px;}
  .code{
    font-family:'Space Grotesk',sans-serif;
    font-size:clamp(80px,20vw,140px);
    font-weight:800;
    background:linear-gradient(135deg, var(--teal), var(--gold));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    line-height:1; margin-bottom:12px;
  }
  h1{font-size:clamp(20px,4vw,28px); font-weight:700; margin-bottom:12px;}
  p{color:var(--text-muted); font-size:16px; line-height:1.7; margin-bottom:28px;}
  .home-btn{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--teal); color:#fff; font-weight:700; font-size:15px;
    padding:13px 30px; border-radius:100px; text-decoration:none;
    transition:background .2s, transform .2s;
  }
  .home-btn:hover{background:#7a5be6; transform:translateY(-2px);}
  .home-btn svg{width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2;}
  .lang-toggle{
    margin-top:24px; font-size:13px; color:var(--text-muted); cursor:pointer;
    background:none; border:1px solid var(--line); padding:6px 14px; border-radius:100px;
    font-family:'Space Grotesk',sans-serif; font-weight:600;
    transition:border-color .2s, color .2s;
  }
  .lang-toggle:hover{border-color:var(--teal); color:var(--teal);}
  [data-lang="en"]{display:none;}
  .en [data-lang="ar"]{display:none;}
  .en [data-lang="en"]{display:block;}
  .en span[data-lang="en"]{display:inline;}
</style>
</head>
<body>
<div class="container">
  <div class="code">404</div>
  <h1 data-lang="ar">الصفحة غير موجودة</h1>
  <h1 data-lang="en">Page Not Found</h1>
  <p data-lang="ar">عذراً، الصفحة التي تبحث عنها غير موجودة أو تم نقلها. يمكنك العودة إلى الصفحة الرئيسية.</p>
  <p data-lang="en">Sorry, the page you're looking for doesn't exist or has been moved. You can go back to the homepage.</p>
  <a class="home-btn" href="/">
    <svg viewBox="0 0 24 24"><path d="M4 21V10l8-6 8 6v11"/><path d="M9 21v-6h6v6"/></svg>
    <span data-lang="ar">الصفحة الرئيسية</span><span data-lang="en">Go Home</span>
  </a>
  <br>
  <button class="lang-toggle" onclick="document.body.classList.toggle('en'); this.textContent=document.body.classList.contains('en')?'عربي':'EN';">EN</button>
</div>
</body>
</html>
